---
ancestor: null
releases:
  0.2.0:
    changes:
      release_summary: "Hardened user/group/ssh/sudo roles: sudoers validation, multi-key authorized_keys, OS assertions."
      bugfixes:
        - "sudo - sudoers files are now validated with visudo before installation; an invalid render can no longer break sudo"
        - "sudo - assert that sudo.macros entries exist in sudo_macros and are non-empty when nopasswd is false"
        - "sudo - sanitize dots and tildes in /etc/sudoers.d filenames (sudo silently ignores such files)"
        - "ssh - authorized_keys now aggregates all keys into one file; previously each key overwrote the previous one"
        - "ssh - fall back to /home/<name> when a catalog entry has no home field"
        - "groups - groups_list entries without an explicit state are now created (documented default is present)"
        - "groups - users without a group field no longer crash group extraction"
        - "users - generated passwords are now only applied on user creation (update_password on_create); root receives only explicit passwords"
        - "users - explicit plaintext passwords are now hashed with a deterministic per-user salt (stable across runs)"
        - "users - root account tasks now compare the current state and only change when needed (idempotent)"
      minor_changes:
        - "users_list entries with state: absent no longer require a catalog entry; the id is used as the username for deletion"
        - "all roles - assert Debian 13 (trixie) and fail fast on other systems"
        - "all roles - task names normalized to the ROLE - prefix style"
        - "groups, ssh, sudo - define users_catalog and users_list defaults so standalone runs work"
