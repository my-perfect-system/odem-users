---
- name: Create present groups
  ansible.builtin.group:
    name: "{{ item.name | default(item) }}"
    gid: "{{ item.gid | default(omit) }}"
    system: "{{ item.system | default(omit) }}"
    state: present
  loop: "{{ groups_present }}"
  loop_control:
    label: "{{ item.name | default(item) }}"
