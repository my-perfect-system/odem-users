---
- name: Assert Debian 13 target
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["distribution_major_version"] | int == 13
    fail_msg: "This role supports Debian 13 (trixie) only"
    quiet: true

- name: Resolve group lists
  ansible.builtin.include_tasks: facts.yml
- name: Add present groups
  ansible.builtin.include_tasks: add.yml

- name: Remove absent groups
  ansible.builtin.include_tasks: del.yml
