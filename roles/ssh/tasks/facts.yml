---
- name: Initialize authorized_keys accumulator
  ansible.builtin.set_fact:
    ssh_auth_key_lines: []

- name: Build authorized_keys content per user
  ansible.builtin.set_fact:
    ssh_auth_key_lines: "{{ ssh_auth_key_lines | default([]) + [line] }}"
  vars:
    line: "{{ item.content if item.content is defined else lookup('file', item.path) }}"
  loop: "{{ entity.authorized_keys }}"
