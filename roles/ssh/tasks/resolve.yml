---
- name: SSH - Validate present users_list entries exist in users_catalog
  ansible.builtin.assert:
    that: item.name in users_catalog
    msg: "user '{{ item.name }}' in users_list has no entry in users_catalog (required for state: present)"
    quiet: true
  loop: "{{ users_list }}"
  when: item.state | default('present') == 'present'
  loop_control:
    label: "{{ item.name }}"

- name: SSH - Resolve users_list to catalog entries
  ansible.builtin.set_fact:
    ssh_users_resolved: "{{ ssh_users_resolved | default([]) + [resolved_entry] }}"
  vars:
    catalog_entry: "{{ users_catalog[item.name] | default({}) }}"
    resolved_entry: >-
      {{
        catalog_entry | combine({
          'id': item.name,
          'name': (catalog_entry.name | default(item.name)),
          'state': (item.state | default('present'))
        })
      }}
  loop: "{{ users_list }}"
  loop_control:
    label: "{{ item.name }}"

- name: SSH - Split resolved users into present and absent
  ansible.builtin.set_fact:
    ssh_users_present: "{{ ssh_users_resolved | selectattr('state', 'equalto', 'present') | list }}"
    ssh_users_absent: "{{ ssh_users_resolved | selectattr('state', 'equalto', 'absent') | list }}"
