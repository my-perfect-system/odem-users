argument_specs:
  main:
    short_description: Main entry point for the sudo role.
    description:
    - Renders every C(sudo_macros) entry as a Cmnd_Alias into the shared macros file
      (C(sudo_macros_file), default C(/etc/sudoers.d/00_macros)).
    - Manages per-user C(/etc/sudoers.d/<name>) entries that reference the shared
      Cmnd_Alias macros by name (instead of expanding the command lists inline)
      for users in C(users_list) whose state is C(present) and which declare a C(sudo)
      sub-option. C(sudo.macros) references the C(sudo_macros) dict.
    - 'Users with C(sudo.nopasswd: true) get C(NOPASSWD: ALL) instead of macro references.'
    - Manages membership in the C(sudo) (Debian) or C(wheel) (RedHat) system group via
      C(sudo.group) in the catalog (adds user when true, removes when false).
    - Removes per-user sudoers files for users whose state is C(absent).
    - Reads C(users_catalog) and C(users_list); resolves catalog references (same
      as the users role).
    options:
      sudo_macros:
        type: dict
        required: false
        description: Mapping of macro names (referenced from C(sudo.macros) per user)
          to lists of command patterns rendered as Cmnd_Alias entries into the shared
          macros file.
      sudo_macros_file:
        type: str
        required: false
        default: /etc/sudoers.d/00_macros
        description: Path of the shared Cmnd_Alias macros file referenced by every
          per-user sudoers file.
