argument_specs:
  main:
    short_description: Main entry point for the sudo role.
    description:
    - Manages per-user C(/etc/sudoers.d/<name>) entries via C(community.general.sudoers)
      for users in C(users_list) whose state is C(present) and which declare a C(sudo)
      sub-option. C(sudo.macros) references the C(sudo_macros) dict; the macros are
      resolved inline to a flat command list per user.
    - Manages membership in the C(sudo) system group via C(sudo.group) in the catalog
      (adds user when true, removes when false).
    - Removes per-user sudoers files for users whose state is C(absent).
    - Reads C(users_catalog) and C(users_list); resolves catalog references (same
      as the users role).
    options:
      sudo_macros:
        type: dict
        required: false
        description: Mapping of macro names (referenced from C(sudo.macros) per user)
          to lists of command patterns that get expanded inline into each per-user
          sudoers file.
