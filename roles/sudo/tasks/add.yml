---
- name: Validate user sudo declarations
  ansible.builtin.assert:
    that:
      - entity.sudo.nopasswd | default(false) or (entity.sudo.macros | default([])) | length > 0
      - (entity.sudo.macros | default([])) is subset(sudo_macros.keys())
    fail_msg: "user '{{ entity.name }}' declares sudo.macros that are empty or not defined in sudo_macros"
    quiet: true
  loop: "{{ identity_users_present }}"
  when: entity.sudo is defined
  loop_control:
    label: "{{ entity.name }}"
    loop_var: entity

- name: Manage per-user sudoers rules
  community.general.sudoers:
    name: "{{ entity.name | replace('.', '_') | replace('~', '_') }}"
    user: "{{ entity.name }}"
    nopassword: "{{ entity.sudo.nopasswd | default(false) }}"
    commands: "{{ entity.sudo.macros | default([])
                | map('extract', sudo_macros) | flatten | unique
                if not (entity.sudo.nopasswd | default(false)) else ['ALL'] }}"
    validation: required
  when: entity.sudo is defined
  loop: "{{ identity_users_present }}"
  loop_control:
    label: "{{ entity.name }}"
    loop_var: entity

- name: Add users to sudo group when requested
  ansible.builtin.user:
    name: "{{ entity.name }}"
    groups: sudo
    append: true
  loop: "{{ identity_users_present }}"
  when: entity.sudo.group | default(false)
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Remove users from sudo group when not requested
  ansible.builtin.command:
    cmd: "gpasswd -d {{ entity.name }} sudo"
  register: sudo_group_remove
  changed_when: sudo_group_remove.rc == 0
  failed_when:
    - sudo_group_remove.rc != 0
    - '"is not a member of" not in sudo_group_remove.stderr | default("")'
  loop: "{{ identity_users_present }}"
  when:
    - entity.sudo.group is defined
    - not (entity.sudo.group | default(false))
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
