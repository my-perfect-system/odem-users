argument_specs:
  main:
    short_description: Main entry point for the users role.
    description:
    - Manages Linux user accounts on Debian 13.
    - Reads C(users_catalog) (identity dict keyed by unique id) and C(users_list)
      (assignment list of name + state pairs).
    - Each users_list entry references a catalog entry by its key (the unique id).
    - The catalog entry provides all identity fields, including the real OS username
      via C(name).
    - 'Missing catalog entries fail the role for entries with C(state: present).'
    - 'Entries with C(state: absent) do not require a catalog entry; the id is used
      as the username for deletion.'
    - SSH key deployment is handled by the separate C(mps.users.ssh) role, which reads
      the same C(users_catalog)/C(users_list).
    - Sudoers management is handled by the separate C(mps.users.sudo) role, which
      reads the same C(users_catalog)/C(users_list).
    options:
      users_enable_print_passwords_plaintext:
        type: bool
        default: false
        description: Print generated passwords and hashes to stdout (debug only).
