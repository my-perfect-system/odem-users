---
- name: Remove users marked absent
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: "absent"
    remove: true
    force: true
  loop: "{{ identity_users_absent }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove home directories of absent users
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}"
    state: absent
  loop: "{{ identity_users_absent }}"
  loop_control:
    label: "{{ item.name }}"
